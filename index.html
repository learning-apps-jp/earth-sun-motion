<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102943"><meta name="apple-mobile-web-app-capable" content="yes"><title>地球と太陽の一日</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div><p class="eyebrow">地球の動きと、空の見え方</p><h1>地球と太陽の一日<span>まわる地球。移り変わる空。</span></h1></div><span class="tag">地球の自転</span></header>
<section class="lab" aria-label="地球と空の連動図">
<div class="panel space"><div class="panel-head"><div><h2><span>01</span> 宇宙から見る</h2><span class="sub">北極の上空から</span></div><button id="directions-toggle" class="direction-toggle" aria-pressed="false" aria-controls="compass">方角を表示</button></div>
<svg id="earth-view" viewBox="80 0 600 365" role="img" aria-label="北極の上空から見た地球。上から太陽の光が当たり、地球は反時計回りに自転する。">
<defs><radialGradient id="ocean"><stop stop-color="#5ebbd3"/><stop offset="1" stop-color="#217a9e"/></radialGradient><clipPath id="globe"><circle cx="380" cy="185" r="116"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a8e5bd"/></marker><marker id="light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#fbc75e"/></marker></defs>
<defs><radialGradient id="atmosphere"><stop offset=".70" stop-color="#50ccec" stop-opacity="0"/><stop offset=".83" stop-color="#5ddaff" stop-opacity=".24"/><stop offset="1" stop-color="#59c8f7" stop-opacity="0"/></radialGradient><radialGradient id="sphere" cx="40%" cy="10%" r="95%"><stop stop-color="#ffffff" stop-opacity=".27"/><stop offset=".55" stop-color="#081f3e" stop-opacity="0"/><stop offset="1" stop-color="#020e23" stop-opacity=".65"/></radialGradient><linearGradient id="night-fade" x2="0" y2="1"><stop stop-color="#07172e" stop-opacity=".28"/><stop offset=".15" stop-color="#07172e" stop-opacity=".80"/><stop offset="1" stop-color="#07172e" stop-opacity=".94"/></linearGradient></defs>
<g fill="#b8e3ff" opacity=".48"><circle cx="130" cy="51" r="1.5"/><circle cx="185" cy="110" r="1"/><circle cx="612" cy="65" r="1.5"/><circle cx="640" cy="276" r="1"/><circle cx="152" cy="295" r="1.5"/><circle cx="570" cy="315" r="1"/><circle cx="220" cy="22" r="1"/><circle cx="617" cy="190" r="1"/></g>
<text x="187" y="37" text-anchor="middle" fill="#ffe2a2" font-size="14">太陽の光</text><g stroke="#fbc75e" stroke-width="3" marker-end="url(#light-arrow)"><path d="M250 25v50"/><path d="M315 12v40"/><path d="M445 12v40"/><path d="M510 25v50"/></g>
<circle cx="380" cy="185" r="148" fill="url(#atmosphere)"/>
<circle cx="380" cy="185" r="120" fill="none" stroke="#91dce4" stroke-opacity=".16" stroke-width="5"/>
<g clip-path="url(#globe)"><circle cx="380" cy="185" r="116" fill="url(#ocean)"/><g id="land" fill="#8dcf9c" stroke="#b5e3bd" stroke-width="1"><path d="M366 85l-30 9-15 23-22 9-13 31 13 25 17-8 11 14 26-9 9-22-13-11 14-19 18-7 4-19Z"/><path d="M414 83l28 17 31 28 6 26-17 6-9 24-23 6-11-22-15-5-15-23 11-15-10-18Z"/><path d="M401 239l23 3 12 23-17 26-24 4-14-18 5-20Z"/><path d="M325 226l-20 12 4 20 20 14 15-13-6-20Z"/></g><path d="M264 185h232" stroke="#dcf7ff" stroke-dasharray="4 5" opacity=".45"/><rect x="260" y="185" width="240" height="125" fill="url(#night-fade)"/></g>
<g clip-path="url(#globe)" pointer-events="none"><g stroke="#cef3fc" stroke-width=".7" fill="none" opacity=".2"><circle cx="380" cy="185" r="40"/><circle cx="380" cy="185" r="78"/><path d="M264 185h232M380 69v232M298 103l164 164M298 267l164-164"/></g><g id="clouds" fill="none" stroke="#e9fcff" stroke-width="4" stroke-linecap="round" opacity=".35"><path d="M313 114q22-15 43-4M421 119q24 8 34 31M303 204q5 27 24 32M399 267q22 0 37-15"/></g><circle cx="380" cy="185" r="116" fill="url(#sphere)"/></g>
<circle cx="380" cy="185" r="4" fill="white"/><text x="380" y="208" text-anchor="middle" fill="white" font-size="13">北極</text>
<path d="M514 169 A136 136 0 0 0 396 50" fill="none" stroke="#a8e5bd" stroke-width="3" marker-end="url(#arrow)"/><text x="548" y="130" fill="#b5e8c4" font-size="13">自転の向き</text><text x="548" y="151" fill="#b5e8c4" font-size="13">西 → 東</text>
<text x="380" y="91" text-anchor="middle" fill="#e4f8ff" font-size="13">昼</text><text x="380" y="285" text-anchor="middle" fill="#c3d7eb" font-size="13">夜</text>
<g id="sunrise-label"><rect x="523" y="174" width="80" height="27" rx="13" fill="#264359"/><text x="563" y="192" text-anchor="middle" fill="white" font-size="13">日の出</text></g>
<g id="sunset-label"><rect x="157" y="174" width="80" height="27" rx="13" fill="#264359"/><text x="197" y="192" text-anchor="middle" fill="white" font-size="13">日の入り</text></g>
<g id="observer"><circle r="18" fill="#ff7668" opacity=".2"/><circle r="9" fill="#ff7668" stroke="white" stroke-width="2"/><path d="M-4-17v-9a4 4 0 0 1 8 0v9M0-18v-8" stroke="#ffb0a6" stroke-width="4" stroke-linecap="round"/></g>
<g id="compass" display="none" pointer-events="none"><path id="north-guide" stroke="#b4e8ff" stroke-dasharray="4 5" stroke-width="1.5"/><g id="compass-n" class="compass-label"><circle r="14"/><text y="5">北</text></g><g id="compass-e" class="compass-label east"><circle r="14"/><text y="5">東</text></g><g id="compass-s" class="compass-label"><circle r="14"/><text y="5">南</text></g><g id="compass-w" class="compass-label"><circle r="14"/><text y="5">西</text></g></g>
<circle id="drag-surface" cx="380" cy="185" r="145" fill="transparent" aria-hidden="true"/>
</svg></div>
<div class="connection"><span>同じ人の視点</span><b>↓</b></div>
<div class="panel ground"><div class="panel-head"><h2><span>02</span> 地上から見る</h2><span class="sub">南を向いた空</span></div>
<svg id="sky-view" viewBox="0 0 760 255" role="img" aria-label="地上から南を向いて見た空"><defs><linearGradient id="sky-color" x2="0" y2="1"><stop id="sky-top" stop-color="#6cbde2"/><stop id="sky-bottom" offset="1" stop-color="#fce6bc"/></linearGradient><radialGradient id="sun-glow"><stop stop-color="#ffe3a0" stop-opacity=".7"/><stop offset="1" stop-color="#ffc85d" stop-opacity="0"/></radialGradient><clipPath id="sky-clip"><rect x="0" y="-800" width="760" height="990"/></clipPath></defs>
<defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#6eb6c4"/><stop offset="1" stop-color="#294e66"/></linearGradient><linearGradient id="reflection" x2="0" y2="1"><stop stop-color="#ffe5aa" stop-opacity=".75"/><stop offset="1" stop-color="#ffe5aa" stop-opacity="0"/></linearGradient></defs>
<rect id="sky-backdrop" width="760" height="255" fill="url(#sky-color)"/><g id="stars" fill="white"><circle cx="75" cy="65" r="1.5"/><circle cx="160" cy="28" r="1"/><circle cx="270" cy="77" r="1.5"/><circle cx="420" cy="22" r="1.5"/><circle cx="530" cy="60" r="1"/><circle cx="680" cy="35" r="1.5"/><circle cx="210" cy="45" r="1"/><circle cx="591" cy="104" r="1"/><circle cx="351" cy="90" r="1"/></g>
<g id="sky-clouds" fill="white" opacity=".28"><path d="M55 85q15-12 30-3 13-22 34-7 19-3 28 10Z"/><path d="M568 56q18-15 30-4 20-17 39 5Z"/></g>
<path d="M95 190Q380 -120 665 190" fill="none" stroke="white" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 7"/>
<g clip-path="url(#sky-clip)"><g id="sun"><circle r="43" fill="url(#sun-glow)"/><circle r="14" fill="#ffd36b" stroke="#fff2b5" stroke-width="2"/></g></g>
<path d="M0 190L25 181 43 188 69 176 83 185 110 190 642 190 678 180 698 185 727 170 760 183V255H0Z" fill="#728f9f" opacity=".65"/>
<path d="M0 190H760V255H0Z" fill="url(#water)"/><path id="sun-reflection" d="M-7 191H7L46 255H-46Z" fill="url(#reflection)"/>
<g stroke="#c6e5e8" stroke-width="1" opacity=".28"><path d="M20 202h96m45 9h106m205-8h115m58 13h90M50 231h108m58 6h70m174-9h102m70 15h65M301 197h101"/></g>
<path d="M268 255q16-30 57-25l31-7 54 8q37-4 63 24Z" fill="#284c51"/><path d="M308 255l5-14m7 14-1-20m112 20 3-13" stroke="#6b9990" stroke-width="2"/>
<g fill="#fff" font-size="15" text-anchor="middle"><text x="95" y="224">東</text><text x="380" y="244">南</text><text x="665" y="224">西</text></g>
<g transform="translate(380 207)" fill="#ff7668"><circle cy="-13" r="7"/><path d="M-11 12v-12a11 11 0 0 1 22 0v12Z"/></g></svg>
<div class="caption"><span id="phase" class="phase">日の出</span><p id="description">東から太陽が見え始めます。</p></div></div>
</section>
<section class="controls" aria-label="一日の操作"><div class="transport"><button id="play" class="play" aria-pressed="false">▶ 再生</button><label class="speed">速さ <select id="speed"><option value="1">ふつう</option><option value="0.4">ゆっくり</option></select></label><output id="time-label">日の出ごろ</output></div>
<label class="sr-only" for="timeline">一日の進み具合</label><input id="timeline" type="range" min="0" max="24" step="0.01" value="6" aria-valuetext="日の出ごろ"><div class="ticks"><span>真夜中</span><span>日の出</span><span>正午</span><span>日の入り</span><span>真夜中</span></div>
<div class="jumps"><button data-hour="6">日の出</button><button data-hour="12">正午</button><button data-hour="18">日の入り</button></div></section>
<footer><p>地球は <strong class="green">西から東</strong> へ自転する <span>→</span> 太陽は <strong class="orange">東から西</strong> へ動いて見える</p><small>日本付近の春分・秋分ごろをイメージした模式図です。距離・大きさは実際の比率と異なります。正午は太陽が最も高くなるころ（南中）を表し、時計の12時とは必ずしも一致しません。</small></footer>
</main><script src="app.js"></script></body></html>
